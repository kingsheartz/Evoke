# Render Blueprint — free API for testing (pair with Vercel frontend + Neon DB).
# Docs: docs/deploy/OPTION-C-FREE.md

services:
  - type: web
    name: evoke-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_NAME
        value: Evoke
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: RUN_MIGRATIONS
        value: true
      - key: RUN_SEED
        value: true
      - key: SEED_DEMO
        value: true
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: LOG_LEVEL
        value: warning
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: MAIL_MAILER
        value: failover
      - key: MAIL_FAILOVER_MAILERS
        value: resend,smtp
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Evoke
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_SCHEME
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: NEWSLETTER_MAILER
        value: resend
      - key: MAIL_TIMEOUT
        value: "15"
